name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build page copies (/tools/..., /sites/, /dashboard) and sitemap
        run: |
          node scripts/build-pages.js
          grep -q 'noindex, nofollow' site/dashboard/index.html
          test -f site/tools/broken-link-checker/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"webly.codelove.in","key":"2c7c5ee4ac3ac04bee95a85d3a1eb7e2","keyLocation":"https://webly.codelove.in/2c7c5ee4ac3ac04bee95a85d3a1eb7e2.txt","urlList":["https://webly.codelove.in/","https://webly.codelove.in/tools/","https://webly.codelove.in/sites/","https://webly.codelove.in/tools/site-audit/","https://webly.codelove.in/tools/site-health-checker/","https://webly.codelove.in/tools/uptime-monitor/","https://webly.codelove.in/tools/page-checker/","https://webly.codelove.in/tools/broken-link-checker/","https://webly.codelove.in/tools/keyword-rank-tracker/","https://webly.codelove.in/tools/pagespeed-checker/","https://webly.codelove.in/tools/utm-builder/","https://webly.codelove.in/tools/quick-links/","https://webly.codelove.in/privacy.html","https://webly.codelove.in/terms.html"]}'
